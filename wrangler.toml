# Cloudflare Workers (정적 자산 + API). Netlify 크레딧 소진으로 이전.
name = "goranisee"
main = "worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# 즉시 수집(한국 IP 경유): Browser Run — Free 플랜 하루 10분, 동시 3개
[browser]
binding = "BROWSER"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[observability]
enabled = true
