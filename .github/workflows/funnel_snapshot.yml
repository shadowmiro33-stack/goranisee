name: Competitor Funnel Snapshot

# 경쟁사 퍼널 스냅샷 수집 (GitHub Actions 러너에서 실행 → 사내 IP 노출 없음)
# - 매주 월요일 10:23 KST (01:23 UTC) 자동 실행
# - 수동 실행 시 사이트/단계 지정 가능
on:
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch:
    inputs:
      site:
        description: '특정 사이트 key만 (예: encar). 비우면 전체'
        required: false
        default: ''
      stage:
        description: '특정 단계 key만 (예: home). 비우면 전체'
        required: false
        default: ''

concurrency:
  group: funnel-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (Chromium)
        run: |
          npm i --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Run funnel collector
        env:
          # 이 저장소의 어드민 자동 전송. 비우면 저장소에만 쌓임.
          FUNNEL_ADMIN_URL: ${{ secrets.FUNNEL_ADMIN_URL }}
          FUNNEL_ADMIN_PASSWORD: ${{ secrets.FUNNEL_ADMIN_PASSWORD }}
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.site }}" ] && ARGS="$ARGS --site ${{ github.event.inputs.site }}"
          [ -n "${{ github.event.inputs.stage }}" ] && ARGS="$ARGS --stage ${{ github.event.inputs.stage }}"
          node collector/funnel_collector.cjs $ARGS

      - name: Upload run artifacts (스크린샷·JSON, 30일 보관)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funnel-snapshot-${{ github.run_id }}
          path: snapshots/
          retention-days: 30

      - name: Commit snapshots
        run: |
          git checkout -- package.json 2>/dev/null || true
          git config --global user.name "Funnel Snapshot Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add snapshots/
          git diff --cached --quiet || git commit -m "auto: competitor funnel snapshot [$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')]"
          git push
