name: Ad Observation (record)

# 광고 관측값(소재 수·브랜드검색·키워드 순위)을 어드민에 기록. client_payload: { observation: {...} }
on:
  repository_dispatch:
    types: [funnel_observation]

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Record
        env:
          FUNNEL_ADMIN_URL: ${{ secrets.FUNNEL_ADMIN_URL || 'https://goranisee.netlify.app' }}
          FUNNEL_ADMIN_PASSWORD: ${{ secrets.FUNNEL_ADMIN_PASSWORD }}
          OBS: ${{ toJson(github.event.client_payload.observation) }}
        run: node collector/post_observation.cjs "$OBS"
